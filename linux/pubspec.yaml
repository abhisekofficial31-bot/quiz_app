name: quiz_app
description: A feature-rich quiz application with levels and leaderboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  fl_chart: ^0.68.0
  lottie: ^3.1.0
  google_fonts: ^6.1.0
  animated_text_kit: ^4.2.2
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  confetti: ^0.7.0
  smooth_page_indicator: ^1.1.0
  crypto: ^3.0.3
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
